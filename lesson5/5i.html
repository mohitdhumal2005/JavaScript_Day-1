<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Project</title>
</head>
<body>
    <button onclick="document.getElementById('paragraph').innerHTML='Cart Quantity ='+cartQuantity;">Show</button>
    <button onclick="cartQuantity = cartQuantity + 1">Add To Cart</button>
    <button onclick="cartQuantity = cartQuantity + 2">+2</button>
    <button onclick="cartQuantity = cartQuantity + 3">+3</button>
    <button onclick="cartQuantity = cartQuantity + 4">+4</button>
    <button onclick="cartQuantity = cartQuantity + 5">+5</button>
    <button onclick="cartQuantity = cartQuantity - 1">Remove From Cart</button>
    <button onclick="cartQuantity = 0">Reset Cart</button>

    <p id="paragraph"></p>

    <script>
        let cartQuantity=0;
    </script>
</body>
</html>
