<button onclick="document.getElementById('paragraph').innerHTML = 'result = ' + result;">=</button>
<button onclick="result = result + 1">+1</button>
<button onclick="result = result + 2">+2</button>
<button onclick="result = result - 1">-1</button>
<button onclick="result = result * 2">×2</button>
<button onclick="result = result / 2">÷2</button>
<button onclick="result = 0">clear</button>
<p id="paragraph">result = </p>

<script>
    let result = 0;
</script>
